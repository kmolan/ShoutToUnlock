# tests on every push and PR. on a `v*` tag it also builds everything and ships it everywhere.
# a tag needs these repo secrets: CARGO_REGISTRY_TOKEN, PYPI_API_TOKEN, NPM_TOKEN.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # a manual run builds every release thing and ships none of it. dress rehearsal.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features python,uniffi-bindgen -- -D warnings
      - run: cargo test
      - name: c++ example
        run: |
          cargo build --release
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude examples/cpp_example.cpp -Ltarget/release -lshout_to_unlock -o examples/cpp_example
          LD_LIBRARY_PATH=target/release ./examples/cpp_example
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: python tests
        run: |
          pip install .
          python -m unittest -v tests/test_python.py
      - name: the tag must match the Cargo.toml version, no lying
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"

  # the live demo at kmolan.github.io/ShoutToUnlock. every push to main redeploys it.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --release --target web --out-dir web/pkg --features wasm
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5

  python-wheels:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  python-sdist:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist

  c-libraries:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: package
        shell: bash
        run: |
          shopt -s nullglob
          directory=shout_to_unlock-${{ matrix.name }}
          mkdir -p "$directory/lib"
          cp -r include LICENSE README.md "$directory/"
          cp target/release/*shout_to_unlock*.{so,a,dylib,dll,lib} "$directory/lib/"
          tar -czf "$directory.tar.gz" "$directory"
      - uses: actions/upload-artifact@v4
        with:
          name: release-c-${{ matrix.name }}
          path: shout_to_unlock-${{ matrix.name }}.tar.gz

  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./mobile/android.sh
      - run: tar -czf shout_to_unlock-android.tar.gz -C target android
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: shout_to_unlock-android.tar.gz

  apple:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-darwin
      - run: ./mobile/apple.sh
      - run: cd target/apple && zip -qry ../../shout_to_unlock-apple.zip ShoutToUnlock
      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: shout_to_unlock-apple.zip

  wasm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build --release --target bundler --out-dir pkg --features wasm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: pkg

  # everything below ships only if every build above passed. all or nothing.

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-wheels, python-sdist, c-libraries, android, apple, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-wheels, python-sdist, c-libraries, android, apple, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-wheels, python-sdist, c-libraries, android, apple, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-wheels, python-sdist, c-libraries, android, apple, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
