<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShoutToUnlock: lemme in. LEMME IIIN.</title>
  <meta name="description" content="a lock that opens when u scream at it. loud enough. long enough.">
  <meta property="og:title" content="ShoutToUnlock">
  <meta property="og:description" content="a lock that opens when u scream at it. loud enough. long enough.">
  <meta property="og:url" content="https://kmolan.github.io/ShoutToUnlock/">
  <meta name="theme-color" content="#0b0b0f">
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0b0f;
      --surface: #15151b;
      --edge: #26262f;
      --text: #f4f4f6;
      --muted: #8d8d99;
      --track: #24242c;
      --level: #6aa8ff;
      --loud: #ff4d2e;
      --open: #3ee07f;
      --intensity: 0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 20px;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 50% 40%, rgb(255 77 46 / calc(var(--intensity) * 0.55)), transparent 60%),
        var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: background 0.1s;
    }
    body:has(main.open) {
      background: radial-gradient(circle at 50% 40%, rgb(62 224 127 / 0.35), transparent 60%), var(--background);
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--edge);
      border-radius: 24px;
      padding: 32px 28px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgb(0 0 0 / 0.5);
    }
    #padlock { font-size: 104px; line-height: 1; display: inline-block; }
    main.loud #padlock { animation: shake 0.12s infinite; }
    main.open #padlock { animation: pop 0.5s ease-out; filter: drop-shadow(0 0 24px var(--open)); }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      25% { transform: translate(-3px, 1px) rotate(-4deg); }
      75% { transform: translate(3px, -1px) rotate(4deg); }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-8deg); }
      100% { transform: scale(1.1); }
    }
    h1 { margin: 16px 0 0; font-size: 15px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .tagline { margin: 4px 0 6px; font-size: 40px; font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; }
    .tagline span { color: var(--loud); }
    .subtitle { margin: 0 0 24px; color: var(--muted); }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; color: var(--muted); font-size: 14px; }
    label input { width: 60%; accent-color: var(--loud); }
    .bar { position: relative; height: 18px; border-radius: 9px; background: var(--track); overflow: hidden; margin: 14px 0 4px; }
    .bar > div { height: 100%; width: 0; background: var(--level); }
    #level-bar.loud { background: var(--loud); box-shadow: 0 0 16px var(--loud); }
    #progress-bar { background: var(--open); }
    #threshold-mark { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--text); }
    .caption { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: var(--loud);
      color: #fff;
      font: inherit;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgb(255 77 46 / 0.4); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.4; cursor: default; }
    #status { min-height: 1.5em; margin: 14px 0 0; font-weight: 600; }
    main.open #status { color: var(--open); }
    #share { margin-top: 16px; padding: 14px; border: 1px dashed var(--edge); border-radius: 14px; }
    #share-text { margin: 0; font-size: 14px; }
    #copy { margin-top: 10px; padding: 10px; background: transparent; border: 1px solid var(--edge); color: var(--text); font-size: 15px; font-weight: 600; text-transform: none; }
    #copy:hover { box-shadow: none; border-color: var(--open); }
    footer { max-width: 440px; text-align: center; color: var(--muted); font-size: 13px; }
    footer p { margin: 4px 0; }
    footer a { color: var(--text); }
    @media (prefers-reduced-motion: reduce) {
      main.loud #padlock, main.open #padlock { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div id="padlock">🔒</div>
    <h1>ShoutToUnlock</h1>
    <p class="tagline">lemme in.<br><span>LEMME IIIN.</span></p>
    <p class="subtitle">no password. no face id. just ur lungs</p>

    <label>how loud tho <input id="minimum-level" type="range" min="-60" max="0" step="1" value="-25"></label>
    <label>how long tho <input id="minimum-seconds" type="range" min="0.5" max="10" step="0.5" value="10"></label>
    <div class="caption"><span id="minimum-level-text"></span><span id="minimum-seconds-text"></span></div>

    <div class="bar"><div id="level-bar"></div><span id="threshold-mark"></span></div>
    <div class="caption"><span>ur volume rn</span><span id="level-text">–∞ dBFS</span></div>

    <div class="bar"><div id="progress-bar"></div></div>
    <div class="caption"><span>loud-time jar</span><span id="progress-text">0.0 s</span></div>

    <button id="start">lemme in</button>
    <p id="status"></p>
    <div id="share" hidden>
      <p id="share-text"></p>
      <button id="copy" type="button">copy it. go flex</button>
    </div>
  </main>
  <footer>
    <p>audio stays on ur device. this page sends nothing anywhere, pinky promise.</p>
    <p>rust core, compiled to wasm. <a href="https://github.com/kmolan/ShoutToUnlock">source on github</a></p>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
